name: Refresh profile stats

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-profile-stats.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: Asia/Dhaka
          AUTO_PUSH: false
          THEME: algolia

      - name: Refresh card cache key
        shell: bash
        run: |
          cache_key="${GITHUB_RUN_ID}"
          sed -E -i "s/([&]v=)[0-9]+/\1${cache_key}/g" README.md

      - name: Commit refreshed README
        shell: bash
        run: |
          git add README.md profile-summary-card-output

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile stats"
          git push
